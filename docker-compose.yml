version: '3.8'

services:
  express-app:
    image: ghcr.io/hacepan/another_demo_site
    container_name: express-server
    restart: always
    ports:
      - "80:3000"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json 
    command: --interval 30 express-server --cleanup